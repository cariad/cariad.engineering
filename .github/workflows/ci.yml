name: ci

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  lint:
    env:
      MISE_LOCKED: 1

    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and the pinned tools
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.8

      - name: Lint files against .editorconfig
        run: mise run lint:editorconfig

      - name: Lint Markdown files
        run: mise run lint:markdown

      - name: Lint TOML files
        run: mise run lint:toml

      - env:
          GH_TOKEN: ${{ github.token }}
        name: Audit GitHub Actions files
        run: mise run lint:workflows
