# Nothing updates mise for us. Check https://github.com/jdx/mise/releases now
# and then, but don't take a release younger than a week; we want to give the
# internet a chance to find any problems before we do.
#
# Keep `min_version` in sync with:
#
# - `.github/workflows/ci.yml`•`jdx/mise-action`•`version`
# - mise's schema URL in `.config/tombi.toml`.
min_version = "2026.9.13"

[settings]
# Hide releases younger than a week from `mise outdated --bump`
minimum_release_age = "7d"

[tasks."infra:bootstrap"]
depends = ["lint:infra-bootstrap"]
description = "Show a plan for the infrastructure bootstrap"
dir = "{{ config_root }}/infra/bootstrap"
run = "tofu plan"

[tasks.lint]
# We don't run this task in CI. We give each linter its own named step in
# `.github/workflows/ci.yml`•`jobs`•`lint`•`steps` so failures are quick to
# spot.
#
# We intentionally stop on the first failure because fixing one problem usually
# fixes others, and there's no point burning time and electrons on a report
# that falls out of date before we can finish reading it.
description = "Run the linters, stopping at the first failure"
depends = ["lint:*"]

[tasks."lint:editorconfig"]
description = "Lint files against .editorconfig"
run = "editorconfig-checker"

[tasks."lint:infra-bootstrap"]
description = "Lint the bootstrap OpenTofu files"
dir = "{{ config_root }}/infra/bootstrap"
run = [
  # Check files are formatted correctly:
  "tofu fmt -check -diff -recursive",
  # `tofu validate` requires each root module to have been initialised, which
  # they won't be yet on fresh clones -- so do it!
  #
  # - `-backend=false` — don't touch state.
  # - `-input=false` — headless initialisation.
  # - `-lockfile=readonly` — don't update `.terraform.lock.hcl`, and fail if
  #   providers were added or removed (other drift only warns).
  "tofu init -backend=false -input=false -lockfile=readonly",
  # Check files describe valid infrastructure:
  "tofu validate",
]

[tasks."lint:markdown"]
description = "Lint Markdown files"
run = "rumdl check --deny-config-warnings"

[tasks."lint:toml"]
description = "Lint TOML files"
run = [
  "tombi lint --error-on-warnings .",
  "tombi format --check --diff .",
]

[tasks."lint:web"]
description = "Lint web files"
# Biome skips files that aren't valid UTF-8 without failing them, so we run
# `lint:editorconfig` first and hope its `charset` check catches most of them.
depends = ["lint:editorconfig"]
run = "biome check --error-on-warnings"

# Nothing updates these tools for us. Run `mise outdated --bump` now and then.
[tools]
biome = "2.5.14"                # Lint web files
editorconfig-checker = "4.0.2"  # Lint files against .editorconfig
# Keep in sync with:
#
# - `infra/bootstrap/versions.tf`•`terraform`•`required_version`
opentofu = "1.12.6"             # Infrastructure as code
# Keep in sync with schema URL in `.config/tombi.toml`:
rumdl = "0.2.77"                # Lint Markdown files
tombi = "1.5.5"                 # Lint TOML files
